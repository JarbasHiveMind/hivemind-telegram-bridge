name: License Check

on:
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

jobs:
  license_check:
    uses: OpenVoiceOS/gh-automations/.github/workflows/license-check.yml@dev
    # python-telegram-bot is LGPLv3 (WeakCopyleft). Importing an LGPL Python
    # library at runtime is compatible with this repo's Apache-2.0 license, so
    # WeakCopyleft is allowed here; strong/network copyleft still fail.
    with:
      fail_licenses: "StrongCopyleft,NetworkCopyleft,Other,Error"
    secrets: inherit
